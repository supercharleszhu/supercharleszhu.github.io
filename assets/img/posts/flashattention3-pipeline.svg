<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention-3 combined Hopper pipeline</title>
  <desc id="desc">A timeline showing TMA loading future key and value tiles, two consumer warpgroups alternating asynchronous QK and PV WGMMA issue, and each warpgroup performing the complete online-softmax score epilogue.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="tmaFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="wg0Fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="wg1Fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="epilogue0Fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="epilogue1Fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="barrierArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .lane { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .lane-sub { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .block { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; }
      .block-small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; }
      .note { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .phase { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 5 7; }
      .lane-line { stroke: #94a3b8; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="24" fill="url(#background)"/>

  <text x="60" y="58" class="title">FlashAttention-3: combined Hopper pipeline</text>
  <text x="60" y="88" class="subtitle">TMA producer + ping-pong consumer warpgroups + intra-warpgroup QK/PV/score-epilogue overlap</text>

  <line x1="315" y1="125" x2="1320" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="315" y="114" class="note">time</text>

  <line x1="515" y1="140" x2="515" y2="725" class="grid"/>
  <line x1="780" y1="140" x2="780" y2="725" class="grid"/>
  <line x1="1045" y1="140" x2="1045" y2="725" class="grid"/>
  <text x="395" y="153" class="phase">block j+1 prepared</text>
  <text x="655" y="153" class="phase">steady step j</text>
  <text x="920" y="153" class="phase">steady step j-1</text>

  <text x="55" y="208" class="lane">TMA producer</text>
  <text x="55" y="230" class="lane-sub">HBM to circular SMEM stages</text>
  <line x1="300" y1="215" x2="1320" y2="215" class="lane-line"/>

  <rect x="335" y="178" width="235" height="64" rx="13" fill="url(#tmaFill)" filter="url(#shadow)"/>
  <text x="452" y="204" text-anchor="middle" class="block">load K/V[j]</text>
  <text x="452" y="225" text-anchor="middle" class="block-small">future pipeline stage</text>

  <rect x="650" y="178" width="235" height="64" rx="13" fill="url(#tmaFill)" filter="url(#shadow)"/>
  <text x="767" y="204" text-anchor="middle" class="block">load K/V[j-1]</text>
  <text x="767" y="225" text-anchor="middle" class="block-small">future pipeline stage</text>

  <rect x="965" y="178" width="235" height="64" rx="13" fill="url(#tmaFill)" filter="url(#shadow)"/>
  <text x="1082" y="204" text-anchor="middle" class="block">load K/V[j-2]</text>
  <text x="1082" y="225" text-anchor="middle" class="block-small">future pipeline stage</text>

  <text x="55" y="315" class="lane">WG0 Tensor Cores</text>
  <text x="55" y="337" class="lane-sub">asynchronous WGMMA issue</text>
  <line x1="300" y1="322" x2="1320" y2="322" class="lane-line"/>

  <rect x="350" y="285" width="130" height="64" rx="13" fill="url(#wg0Fill)" filter="url(#shadow)"/>
  <text x="415" y="313" text-anchor="middle" class="block">QK0[j]</text>
  <text x="415" y="334" text-anchor="middle" class="block-small">GEMM0</text>

  <rect x="490" y="285" width="150" height="64" rx="13" fill="url(#wg0Fill)" filter="url(#shadow)"/>
  <text x="565" y="313" text-anchor="middle" class="block">PV0[j+1]</text>
  <text x="565" y="334" text-anchor="middle" class="block-small">GEMM1</text>

  <rect x="960" y="285" width="130" height="64" rx="13" fill="url(#wg0Fill)" filter="url(#shadow)"/>
  <text x="1025" y="313" text-anchor="middle" class="block">QK0[j-1]</text>
  <text x="1025" y="334" text-anchor="middle" class="block-small">next GEMM0</text>

  <rect x="1100" y="285" width="140" height="64" rx="13" fill="url(#wg0Fill)" filter="url(#shadow)"/>
  <text x="1170" y="313" text-anchor="middle" class="block">PV0[j]</text>
  <text x="1170" y="334" text-anchor="middle" class="block-small">next GEMM1</text>

  <text x="55" y="423" class="lane">WG0 CUDA/SFU</text>
  <text x="55" y="445" class="lane-sub">complete score epilogue</text>
  <line x1="300" y1="430" x2="1320" y2="430" class="lane-line"/>

  <rect x="650" y="385" width="360" height="88" rx="15" fill="url(#epilogue0Fill)" filter="url(#shadow)"/>
  <text x="830" y="409" text-anchor="middle" class="block">score epilogue 0[j]</text>
  <text x="830" y="433" text-anchor="middle" class="block-small">mask | rowmax | alpha | rescale row_sum</text>
  <text x="830" y="455" text-anchor="middle" class="block-small">exp | add row_sum | rescale O | prepare P0[j]</text>

  <text x="55" y="536" class="lane">WG1 Tensor Cores</text>
  <text x="55" y="558" class="lane-sub">asynchronous WGMMA issue</text>
  <line x1="300" y1="543" x2="1320" y2="543" class="lane-line"/>

  <rect x="650" y="506" width="130" height="64" rx="13" fill="url(#wg1Fill)" filter="url(#shadow)"/>
  <text x="715" y="534" text-anchor="middle" class="block">QK1[j]</text>
  <text x="715" y="555" text-anchor="middle" class="block-small">GEMM0</text>

  <rect x="790" y="506" width="150" height="64" rx="13" fill="url(#wg1Fill)" filter="url(#shadow)"/>
  <text x="865" y="534" text-anchor="middle" class="block">PV1[j+1]</text>
  <text x="865" y="555" text-anchor="middle" class="block-small">GEMM1</text>

  <rect x="1250" y="506" width="120" height="64" rx="13" fill="url(#wg1Fill)" filter="url(#shadow)"/>
  <text x="1310" y="534" text-anchor="middle" class="block">QK1[j-1]</text>
  <text x="1310" y="555" text-anchor="middle" class="block-small">next GEMM0</text>

  <text x="55" y="649" class="lane">WG1 CUDA/SFU</text>
  <text x="55" y="671" class="lane-sub">complete score epilogue</text>
  <line x1="300" y1="656" x2="1320" y2="656" class="lane-line"/>

  <rect x="965" y="611" width="355" height="88" rx="15" fill="url(#epilogue1Fill)" filter="url(#shadow)"/>
  <text x="1142" y="635" text-anchor="middle" class="block">score epilogue 1[j]</text>
  <text x="1142" y="659" text-anchor="middle" class="block-small">mask | rowmax | alpha | rescale row_sum</text>
  <text x="1142" y="681" text-anchor="middle" class="block-small">exp | add row_sum | rescale O | prepare P1[j]</text>

  <path d="M 640 317 C 700 365, 600 470, 646 532" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#barrierArrow)"/>
  <rect x="624" y="371" width="157" height="31" rx="15" fill="#fee2e2" stroke="#fecaca"/>
  <text x="702" y="392" text-anchor="middle" class="tiny" fill="#991b1b">token: WG0 to WG1</text>

  <path d="M 940 538 C 1010 500, 900 400, 956 326" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#barrierArrow)"/>
  <rect x="900" y="455" width="157" height="31" rx="15" fill="#fee2e2" stroke="#fecaca"/>
  <text x="978" y="476" text-anchor="middle" class="tiny" fill="#991b1b">token: WG1 to WG0</text>

  <rect x="55" y="752" width="1290" height="105" rx="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="782" class="note">What overlaps</text>

  <rect x="80" y="800" width="22" height="22" rx="5" fill="url(#tmaFill)"/>
  <text x="112" y="816" class="tiny">TMA moves future K/V tiles</text>

  <rect x="350" y="800" width="22" height="22" rx="5" fill="url(#wg0Fill)"/>
  <text x="382" y="816" class="tiny">Tensor Cores execute queued QK/PV WGMMA</text>

  <rect x="745" y="800" width="22" height="22" rx="5" fill="url(#epilogue0Fill)"/>
  <text x="777" y="816" class="tiny">CUDA/SFU update online-softmax state</text>

  <path d="M 1120 811 L 1160 811" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#barrierArrow)"/>
  <text x="1172" y="816" class="tiny">named-barrier handoff</text>

  <text x="80" y="844" class="tiny">Each warpgroup owns different Q-row fragments, reuses the same read-only K/V stages, and carries P[j] forward to PV[j] in the next step.</text>
</svg>
