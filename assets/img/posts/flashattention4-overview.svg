<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention-3 versus FlashAttention-4 execution model</title>
  <desc id="desc">Hopper FlashAttention-3 uses WGMMA and register accumulators, while Blackwell FlashAttention-4 uses tcgen05 MMA, tensor memory, and more specialized warp roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      .title{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.head{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.note{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1400" height="760" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" class="title">From FlashAttention-3 to FlashAttention-4</text>
  <text x="60" y="88" class="sub">The attention recurrence stays online; Blackwell changes where accumulators live and how work is divided.</text>

  <rect x="55" y="125" width="620" height="555" rx="22" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="90" y="170" class="head">FA3 on Hopper</text>
  <text x="90" y="200" class="small">WGMMA is issued by consumer warpgroups.</text>
  <rect x="105" y="245" width="170" height="68" rx="14" fill="#0891b2"/><text x="190" y="286" text-anchor="middle" class="label">TMA K / V</text>
  <line x1="275" y1="279" x2="330" y2="279" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="245" width="190" height="68" rx="14" fill="#2563eb"/><text x="435" y="286" text-anchor="middle" class="label">QK WGMMA</text>
  <line x1="435" y1="313" x2="435" y2="365" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="375" width="190" height="68" rx="14" fill="#ea580c"/><text x="435" y="416" text-anchor="middle" class="label">softmax</text>
  <line x1="435" y1="443" x2="435" y2="495" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="505" width="190" height="68" rx="14" fill="#16a34a"/><text x="435" y="546" text-anchor="middle" class="label">PV WGMMA</text>
  <text x="105" y="625" class="note">S, P, and O are primarily register fragments.</text>
  <text x="105" y="650" class="small">Ping-pong warpgroups and intra-warpgroup overlap hide latency.</text>

  <rect x="725" y="125" width="620" height="555" rx="22" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="760" y="170" class="head">FA4 on Blackwell</text>
  <text x="760" y="200" class="small">One MMA warp issues tcgen05; specialized warps transform the results.</text>
  <rect x="765" y="245" width="145" height="68" rx="14" fill="#0891b2"/><text x="838" y="286" text-anchor="middle" class="label">TMA</text>
  <line x1="910" y1="279" x2="955" y2="279" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="965" y="245" width="160" height="68" rx="14" fill="#2563eb"/><text x="1045" y="276" text-anchor="middle" class="label">tcgen05</text><text x="1045" y="297" text-anchor="middle" class="label">QK / PV</text>
  <line x1="1125" y1="279" x2="1170" y2="279" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1180" y="245" width="125" height="68" rx="14" fill="#7c3aed"/><text x="1243" y="286" text-anchor="middle" class="label">TMEM</text>

  <path d="M1243 313V360H1005" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="780" y="375" width="225" height="78" rx="14" fill="#ea580c"/><text x="893" y="408" text-anchor="middle" class="label">softmax warps</text><text x="893" y="432" text-anchor="middle" class="small" fill="#fff">S read, P written</text>
  <rect x="1040" y="375" width="250" height="78" rx="14" fill="#16a34a"/><text x="1165" y="408" text-anchor="middle" class="label">correction warps</text><text x="1165" y="432" text-anchor="middle" class="small" fill="#fff">lazy O rescale</text>
  <path d="M1005 414H1030" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1165 453V505" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1040" y="515" width="250" height="68" rx="14" fill="#0f766e"/><text x="1165" y="556" text-anchor="middle" class="label">SMEM → TMA O</text>
  <text x="765" y="625" class="note">TMEM is the exchange point between Tensor Cores and CUDA cores.</text>
  <text x="765" y="650" class="small">S is overwritten by P; O remains in TMEM until correction and output.</text>
</svg>
