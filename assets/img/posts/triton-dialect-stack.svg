<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Triton MLIR dialect stack and preserved invariants</title>
  <desc id="desc">A layered diagram from TTIR through TritonGPU and NVIDIA-specific dialects to LLVM and PTX, showing what each level adds and consumes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      .title{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.head{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.note{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1400" height="800" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Triton uses dialect boundaries as compiler contracts</text>
  <text x="60" y="88" class="sub">Each level preserves the information needed by its optimizations and makes lower-level commitments explicit.</text>

  <rect x="75" y="145" width="240" height="130" rx="18" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="195" y="184" text-anchor="middle" class="head">TTIR · tt.*</text>
  <text x="195" y="214" text-anchor="middle" class="small">tensor semantics</text><text x="195" y="238" text-anchor="middle" class="small">masks, pointers, dot, reduce</text>
  <line x1="315" y1="210" x2="365" y2="210" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="375" y="145" width="240" height="130" rx="18" fill="#2563eb" filter="url(#shadow)"/>
  <text x="495" y="184" text-anchor="middle" class="head">TTGIR · ttg.*</text>
  <text x="495" y="214" text-anchor="middle" class="small">distributed layouts</text><text x="495" y="238" text-anchor="middle" class="small">shared memory, async ops</text>
  <line x1="615" y1="210" x2="665" y2="210" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="675" y="145" width="240" height="130" rx="18" fill="#0891b2" filter="url(#shadow)"/>
  <text x="795" y="184" text-anchor="middle" class="head">TTNG · ttng.*</text>
  <text x="795" y="214" text-anchor="middle" class="small">WGMMA, TMA, mbarrier</text><text x="795" y="238" text-anchor="middle" class="small">TMEM and tcgen05</text>
  <line x1="915" y1="210" x2="965" y2="210" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="975" y="145" width="240" height="130" rx="18" fill="#0f766e" filter="url(#shadow)"/>
  <text x="1095" y="184" text-anchor="middle" class="head">NVGPU / LLVM</text>
  <text x="1095" y="214" text-anchor="middle" class="small">per-thread vectors</text><text x="1095" y="238" text-anchor="middle" class="small">addresses, intrinsics, asm</text>
  <line x1="1215" y1="210" x2="1260" y2="210" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1270" y="160" width="80" height="100" rx="16" fill="#16a34a" filter="url(#shadow)"/>
  <text x="1310" y="202" text-anchor="middle" class="head">PTX</text><text x="1310" y="228" text-anchor="middle" class="small">ISA</text>

  <rect x="75" y="350" width="1275" height="330" rx="22" fill="#fff" stroke="#cbd5e1"/>
  <text x="105" y="392" class="note">What changes at each boundary</text>
  <text x="105" y="438" class="note">TTIR → TTGIR</text><text x="300" y="438" class="note">Assign an encoding to every tensor and stamp target topology on the module.</text>
  <text x="105" y="488" class="note">TTGIR optimization</text><text x="300" y="488" class="note">Move between layouts explicitly; select accelerator layouts; schedule async memory and compute.</text>
  <text x="105" y="538" class="note">TTGIR → LLVM</text><text x="300" y="538" class="note">Allocate shared/Tensor Memory, scalarize ownership into per-thread register vectors, legalize target ops.</text>
  <text x="105" y="588" class="note">LLVM → PTX</text><text x="300" y="588" class="note">Select ordinary NVPTX instructions while preserving Triton-emitted inline-PTX contracts.</text>
  <text x="105" y="638" class="note">Design rule</text><text x="300" y="638" class="note">Do an optimization at the highest level that still contains the facts required to prove it correct.</text>
</svg>
